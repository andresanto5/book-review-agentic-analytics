[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-review-genai-a3data"
version = "0.1.0"
description = "Pipeline de reviews de livros com Postgres + pgvector e testes de RAG/LLM."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "psycopg[binary,pool]>=3.1.0,<3.2.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

