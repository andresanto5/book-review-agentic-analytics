name: book-review-demo
x-runtime: &runtime
  build:
    context: ../..
    dockerfile: deploy/demo/Dockerfile.api
  environment: &environment
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_DB: book_reviews
    POSTGRES_USER: app_user
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local environment file}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:?Set the model already authorized in your account}
    BEDROCK_FALLBACK_MODEL_ID: ${BEDROCK_MODEL_ID:?Use the same model to avoid switching to a different price tier}
    MCP_ENABLED: 'true'
    MCP_SERVER_URL: http://mcp:8001/mcp
    MCP_FALLBACK_TO_LOCAL: 'false'
    OMP_NUM_THREADS: '1'
    TOKENIZERS_PARALLELISM: 'false'
  restart: 'no'
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '2'
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: book_reviews
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - demo_db:/var/lib/postgresql/data
      - ../../docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ../../docker/postgres/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U app_user -d book_reviews']
      interval: 5s
      timeout: 5s
      retries: 20
  mcp:
    <<: *runtime
    environment:
      <<: *environment
      MCP_SERVER_HOST: 0.0.0.0
    command: [python, -m, mcp_server.server]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *runtime
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 120s
  web:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile.web
    ports: ['127.0.0.1:8080:80']
    depends_on:
      api:
        condition: service_healthy
volumes:
  demo_db:
